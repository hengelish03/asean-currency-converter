<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASEAN Currency Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-card">
    <h1>💱 ASEAN Currency Converter</h1>
    <p class="subtitle">Convert from <strong>USD</strong> to ASEAN currencies</p>

    <div class="converter-box">
      <input type="number" id="amount" placeholder="Enter amount in USD">

      <div class="select-row">
        <label>From:</label>
        <select id="fromCurrency" disabled></select>
      </div>

      <div class="select-row">
        <label>To:</label>
        <select id="toCurrency"></select>
      </div>

      <button id="convertBtn">Convert</button>
    </div>

    <h2 id="result"></h2>

    <footer>
      <p>Created by <strong>Elish-phoenix</strong> 🔥</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
